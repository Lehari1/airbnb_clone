<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1020" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="100%" stop-color="#E00B41"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="kafkaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="searchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    
    <!-- Filter Drop Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FF385C" flood-opacity="0.3"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; fill: #FFFFFF; font-size: 26px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 400; fill: #94A3B8; font-size: 14px; }
    .tier-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #F8FAFC; font-size: 16px; letter-spacing: 0.5px; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #FFFFFF; font-size: 15px; }
    .card-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 400; fill: #CBD5E1; font-size: 12px; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 11px; fill: #FFFFFF; }
    .conn-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 500; font-size: 11px; fill: #38BDF8; }
  </style>

  <!-- Background Canvas -->
  <rect width="1440" height="1020" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1440" height="8" fill="url(#brandGrad)"/>

  <!-- =========================================================================
       HEADER SECTION
       ========================================================================= -->
  <g transform="translate(60, 45)">
    <!-- Airbnb / Marketplace Icon Mark -->
    <rect x="0" y="0" width="44" height="44" rx="10" fill="url(#brandGrad)" filter="url(#glow)"/>
    <path d="M22 10 C17 10 13 14 13 20 C13 26 22 34 22 34 C22 34 31 26 31 20 C31 14 27 10 22 10 Z M22 23 C20.3 23 19 21.7 19 20 C19 18.3 20.3 17 22 17 C23.7 17 25 18.3 25 20 C25 21.7 23.7 23 22 23 Z" fill="#FFFFFF"/>
    <text x="58" y="24" class="title">Production-Scale Vacation Rental Marketplace Architecture</text>
    <text x="58" y="42" class="subtitle">High-Concurrency Cloud Architecture (100M+ Listings • 50k+ QPS • Sub-50ms Latency • Multi-Region Active-Active)</text>
  </g>

  <!-- =========================================================================
       TIER 1: CLIENTS & GLOBAL EDGE NETWORK
       ========================================================================= -->
  <g transform="translate(60, 115)">
    <rect x="0" y="0" width="1320" height="135" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="24" y="30" class="tier-header">1. CLIENTS &amp; GLOBAL EDGE NETWORK (ANYCAST CDN)</text>

    <!-- Client Box 1: Web App -->
    <g transform="translate(24, 45)">
      <rect x="0" y="0" width="230" height="72" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="16" y="26" class="card-title">Desktop Web SPA / SSR</text>
      <text x="16" y="44" class="card-subtitle">React 18 + TS + CSS Modules</text>
      <text x="16" y="60" class="card-subtitle">Hero Grid • Photo Tour • Lightbox</text>
    </g>

    <!-- Client Box 2: Mobile / Native -->
    <g transform="translate(270, 45)">
      <rect x="0" y="0" width="220" height="72" rx="8" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
      <text x="16" y="26" class="card-title">Mobile &amp; Native Apps</text>
      <text x="16" y="44" class="card-subtitle">iOS (Swift) &amp; Android (Kotlin)</text>
      <text x="16" y="60" class="card-subtitle">React Native / Mobile Web</text>
    </g>

    <!-- Edge Box 3: Anycast CDN & WAF -->
    <g transform="translate(510, 45)">
      <rect x="0" y="0" width="380" height="72" rx="8" fill="url(#edgeGrad)"/>
      <text x="18" y="26" class="card-title">Cloudflare / Fastly Anycast CDN</text>
      <text x="18" y="44" class="card-subtitle">Edge HTML Stale-While-Revalidate (&lt;25ms TTFB)</text>
      <text x="18" y="60" class="card-subtitle">DDoS Mitigation • Bot Management • WebP/AVIF Transforms</text>
    </g>

    <!-- Edge Box 4: API Gateway Ingress -->
    <g transform="translate(910, 45)">
      <rect x="0" y="0" width="386" height="72" rx="8" fill="#0F172A" stroke="#FF385C" stroke-width="2"/>
      <text x="18" y="26" class="card-title">Envoy / Kong API Gateway</text>
      <text x="18" y="44" class="card-subtitle">mTLS • JWT ed25519 Auth • Rate Limiting</text>
      <text x="18" y="60" class="card-subtitle">GraphQL Federated Gateway (GraphOS) / gRPC</text>
    </g>
  </g>

  <!-- Connectors from Tier 1 to Tier 2 -->
  <path d="M720 250 L720 280" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4 4"/>
  <polygon points="716,280 724,280 720,286" fill="#38BDF8"/>

  <!-- =========================================================================
       TIER 2: CORE MICROSERVICES LAYER (KUBERNETES / EKS)
       ========================================================================= -->
  <g transform="translate(60, 285)">
    <rect x="0" y="0" width="1320" height="175" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="24" y="28" class="tier-header">2. CORE MICROSERVICES TIER (Active-Active Kubernetes Clusters with Karpenter Autoscaling)</text>

    <!-- Svc 1: Listing Service -->
    <g transform="translate(24, 45)">
      <rect x="0" y="0" width="195" height="110" rx="8" fill="#0F172A" stroke="#64748B" stroke-width="1"/>
      <rect x="12" y="10" width="60" height="18" rx="4" fill="#3B82F6"/>
      <text x="42" y="23" text-anchor="middle" class="badge-text">CQRS</text>
      <text x="12" y="48" class="card-title">Listing Service</text>
      <text x="12" y="68" class="card-subtitle">• Details &amp; Amenities</text>
      <text x="12" y="84" class="card-subtitle">• Photo Tour Slices</text>
      <text x="12" y="100" class="card-subtitle">• Materialized Read Models</text>
    </g>

    <!-- Svc 2: Search & Discovery -->
    <g transform="translate(235, 45)">
      <rect x="0" y="0" width="205" height="110" rx="8" fill="#0F172A" stroke="#7C3AED" stroke-width="1.5"/>
      <rect x="12" y="10" width="76" height="18" rx="4" fill="#7C3AED"/>
      <text x="50" y="23" text-anchor="middle" class="badge-text">SPATIAL</text>
      <text x="12" y="48" class="card-title">Search &amp; Discovery</text>
      <text x="12" y="68" class="card-subtitle">• Uber H3 Hex Geo Index</text>
      <text x="12" y="84" class="card-subtitle">• Vector Embeddings (k-NN)</text>
      <text x="12" y="100" class="card-subtitle">• Personalized Ranking</text>
    </g>

    <!-- Svc 3: Availability & Pricing -->
    <g transform="translate(456, 45)">
      <rect x="0" y="0" width="205" height="110" rx="8" fill="#0F172A" stroke="#059669" stroke-width="1.5"/>
      <rect x="12" y="10" width="68" height="18" rx="4" fill="#059669"/>
      <text x="46" y="23" text-anchor="middle" class="badge-text">BITSET</text>
      <text x="12" y="48" class="card-title">Availability &amp; Price</text>
      <text x="12" y="68" class="card-subtitle">• 365-Day Bitset Calendar</text>
      <text x="12" y="84" class="card-subtitle">• Dynamic Smart Pricing</text>
      <text x="12" y="100" class="card-subtitle">• Multi-Currency Engine</text>
    </g>

    <!-- Svc 4: Reservation & Booking -->
    <g transform="translate(677, 45)">
      <rect x="0" y="0" width="215" height="110" rx="8" fill="#0F172A" stroke="#FF385C" stroke-width="2"/>
      <rect x="12" y="10" width="90" height="18" rx="4" fill="#FF385C"/>
      <text x="57" y="23" text-anchor="middle" class="badge-text">ACID SAGA</text>
      <text x="12" y="48" class="card-title">Booking &amp; Checkout</text>
      <text x="12" y="68" class="card-subtitle">• Zero Double-Booking Lock</text>
      <text x="12" y="84" class="card-subtitle">• Stripe / Adyen Payment Saga</text>
      <text x="12" y="100" class="card-subtitle">• Immutable Booking Ledger</text>
    </g>

    <!-- Svc 5: Identity & Trust -->
    <g transform="translate(908, 45)">
      <rect x="0" y="0" width="190" height="110" rx="8" fill="#0F172A" stroke="#64748B" stroke-width="1"/>
      <text x="12" y="48" class="card-title">User &amp; Host Service</text>
      <text x="12" y="68" class="card-subtitle">• KYC &amp; Verification</text>
      <text x="12" y="84" class="card-subtitle">• Superhost Badge Engine</text>
      <text x="12" y="100" class="card-subtitle">• Co-host Permissions</text>
    </g>

    <!-- Svc 6: Reviews & Ratings -->
    <g transform="translate(1114, 45)">
      <rect x="0" y="0" width="182" height="110" rx="8" fill="#0F172A" stroke="#64748B" stroke-width="1"/>
      <text x="12" y="48" class="card-title">Reviews &amp; Trust</text>
      <text x="12" y="68" class="card-subtitle">• Cleanliness/Accuracy Scores</text>
      <text x="12" y="84" class="card-subtitle">• Guest Favourite Badge</text>
      <text x="12" y="100" class="card-subtitle">• Sentiment &amp; Spam Filter</text>
    </g>
  </g>

  <!-- Connectors from Tier 2 to Tier 3 -->
  <path d="M400 460 L400 495" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4 4"/>
  <path d="M780 460 L780 495" stroke="#FF385C" stroke-width="2.5" stroke-dasharray="4 4"/>
  <path d="M1000 460 L1000 495" stroke="#059669" stroke-width="2.5" stroke-dasharray="4 4"/>

  <!-- =========================================================================
       TIER 3: DISTRIBUTED CACHING & EVENT-DRIVEN STREAMING
       ========================================================================= -->
  <g transform="translate(60, 495)">
    <rect x="0" y="0" width="1320" height="145" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="24" y="28" class="tier-header">3. IN-MEMORY CACHE &amp; ASYNCHRONOUS EVENT STREAMING TIER</text>

    <!-- Distributed Redis Cluster -->
    <g transform="translate(24, 45)">
      <rect x="0" y="0" width="580" height="82" rx="8" fill="#0F172A" stroke="#DC2626" stroke-width="1.5"/>
      <circle cx="28" cy="24" r="10" fill="#DC2626"/>
      <text x="46" y="28" class="card-title">Distributed Redis 7.x Cluster (AWS ElastiCache / Redis Enterprise)</text>
      <text x="20" y="52" class="card-subtitle">• Redlock Distributed Checkout Mutex (120s TTL lock on listing_id + dates)</text>
      <text x="20" y="70" class="card-subtitle">• 365-Day Availability Bitsets • Materialized Listing JSON Caches (15m TTL)</text>
    </g>

    <!-- Apache Kafka Streaming Cluster -->
    <g transform="translate(630, 45)">
      <rect x="0" y="0" width="666" height="82" rx="8" fill="#0F172A" stroke="url(#kafkaGrad)" stroke-width="1.5"/>
      <circle cx="28" cy="24" r="10" fill="#D97706"/>
      <text x="46" y="28" class="card-title">Apache Kafka Event Streaming Bus (Confluent Cloud / Amazon MSK)</text>
      <text x="20" y="52" class="card-subtitle">• Topics: listing-events (Debezium CDC) • reservation-confirmed • media-upload-jobs</text>
      <text x="20" y="70" class="card-subtitle">• MirrorMaker 2 Cross-Region Event Replication • Dead Letter Queues (DLQ)</text>
    </g>
  </g>

  <!-- Connectors from Tier 3 to Tier 4 -->
  <path d="M400 640 L400 675" stroke="#059669" stroke-width="2.5" stroke-dasharray="4 4"/>
  <path d="M960 640 L960 675" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="4 4"/>

  <!-- =========================================================================
       TIER 4: PERSISTENT STORAGE & SEARCH ENGINES
       ========================================================================= -->
  <g transform="translate(60, 675)">
    <rect x="0" y="0" width="1320" height="155" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="24" y="28" class="tier-header">4. PERSISTENT STORAGE, SEARCH &amp; MEDIA ASSET TIER</text>

    <!-- Storage 1: Relational DB Aurora -->
    <g transform="translate(24, 45)">
      <rect x="0" y="0" width="310" height="92" rx="8" fill="url(#dbGrad)"/>
      <text x="18" y="28" class="card-title">Aurora PostgreSQL (Multi-AZ)</text>
      <text x="18" y="48" class="card-subtitle">ACID Master Data Store</text>
      <text x="18" y="66" class="card-subtitle">• Bookings, Payouts, Users, Listings</text>
      <text x="18" y="82" class="card-subtitle">• 15 Global Read Replicas (&lt;1s sync)</text>
    </g>

    <!-- Storage 2: Document Store ScyllaDB -->
    <g transform="translate(350, 45)">
      <rect x="0" y="0" width="280" height="92" rx="8" fill="#0F172A" stroke="#0EA5E9" stroke-width="1.5"/>
      <text x="18" y="28" class="card-title">ScyllaDB / Cassandra</text>
      <text x="18" y="48" class="card-subtitle">High-Throughput Wide-Column</text>
      <text x="18" y="66" class="card-subtitle">• Review Comments &amp; Timestamps</text>
      <text x="18" y="82" class="card-subtitle">• User Messaging &amp; Activity Log</text>
    </g>

    <!-- Storage 3: OpenSearch Geo Engine -->
    <g transform="translate(646, 45)">
      <rect x="0" y="0" width="330" height="92" rx="8" fill="url(#searchGrad)"/>
      <text x="18" y="28" class="card-title">OpenSearch / Elasticsearch Cluster</text>
      <text x="18" y="48" class="card-subtitle">Geospatial &amp; Full-Text Search</text>
      <text x="18" y="66" class="card-subtitle">• Uber H3 Spatial Hex Sharding</text>
      <text x="18" y="82" class="card-subtitle">• k-NN Semantic Vector Matching</text>
    </g>

    <!-- Storage 4: Blob Storage & Media Pipeline -->
    <g transform="translate(992, 45)">
      <rect x="0" y="0" width="304" height="92" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="18" y="28" class="card-title">AWS S3 / Cloudflare R2</text>
      <text x="18" y="48" class="card-subtitle">Media Ingestion Pipeline</text>
      <text x="18" y="66" class="card-subtitle">• Auto EXIF Stripping &amp; Watermarking</text>
      <text x="18" y="82" class="card-subtitle">• 4K / 1440px / 800px Responsive Cuts</text>
    </g>
  </g>

  <!-- =========================================================================
       TIER 5: MULTI-REGION DEPLOYMENT, GITOPS & OBSERVABILITY
       ========================================================================= -->
  <g transform="translate(60, 855)">
    <rect x="0" y="0" width="1320" height="120" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="24" y="26" class="tier-header">5. MULTI-REGION DEPLOYMENT, GITOPS &amp; RELIABILITY ARCHITECTURE</text>

    <!-- Deploy 1: Multi-Region Active-Active -->
    <g transform="translate(24, 38)">
      <rect x="0" y="0" width="395" height="68" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="16" y="24" class="card-title">Active-Active Multi-Region Deployment</text>
      <text x="16" y="42" class="card-subtitle">• US-East (Primary) + EU-West (Secondary) + AP-South</text>
      <text x="16" y="58" class="card-subtitle">• Route 53 Latency-Based GeoDNS Routing with Automatic Failover</text>
    </g>

    <!-- Deploy 2: GitOps CI/CD & Visual Diffing -->
    <g transform="translate(435, 38)">
      <rect x="0" y="0" width="440" height="68" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="16" y="24" class="card-title">ArgoCD GitOps &amp; Visual QA Pipeline</text>
      <text x="16" y="42" class="card-subtitle">• Progressive Canary Rollouts (5% → 25% → 100%)</text>
      <text x="16" y="58" class="card-subtitle">• Automated Playwright Pixel Diff Verification on Pull Requests</text>
    </g>

    <!-- Deploy 3: Observability & SLA/SLO -->
    <g transform="translate(891, 38)">
      <rect x="0" y="0" width="405" height="68" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="16" y="24" class="card-title">Observability, OpenTelemetry &amp; SLOs</text>
      <text x="16" y="42" class="card-subtitle">• Prometheus Metrics + Grafana Dashboards + OpenTelemetry Tracing</text>
      <text x="16" y="58" class="card-subtitle">• SLO Guardrails: Automated Rollback on Error Rate &gt; 0.05%</text>
    </g>
  </g>

  <!-- Footer Watermark / Status -->
  <g transform="translate(60, 995)">
    <circle cx="6" cy="6" r="4" fill="#10B981"/>
    <text x="18" y="10" class="card-subtitle">PRODUCTION ARCHITECTURE BLUEPRINT • AUDITED FOR PLAYPOWER LABS TAKE-HOME ASSESSMENT • COMPATIBLE WITH EXCALIDRAW &amp; LUCIDCHART</text>
  </g>
</svg>
